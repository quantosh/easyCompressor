<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Compressor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      width: 300px;
      padding: 1rem;
      background: #0f1117;
      color: #e1e4e8;
      font-size: 0.875rem;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header-title h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a5568;
      transition: background 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }
    .status-dot.active {
      background: #38a169;
      box-shadow: 0 0 6px rgba(56, 161, 105, 0.6);
    }
    .header-version {
      font-size: 0.7rem;
      color: #586069;
    }
    .description {
      font-size: 0.8rem;
      color: #8b949e;
      line-height: 1.4;
    }
    .compress-button {
      width: 100%;
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: #1f6feb;
      border: 1px solid #1f6feb;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }
    .compress-button:hover { background: #388bfd; border-color: #388bfd; }
    .compress-button:active { transform: scale(0.98); }
    .compress-button.active {
      background: transparent;
      border-color: #38a169;
      color: #38a169;
    }
    .compress-button.active:hover {
      background: rgba(56, 161, 105, 0.1);
    }
    .meter-section {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #586069;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .meter-wrap {
      position: relative;
      height: 24px;
      background: #161b22;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #21262d;
    }
    #meter-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .settings-toggle {
      width: 100%;
      padding: 0.4rem;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      color: #8b949e;
      background: transparent;
      border: 1px dashed #21262d;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .settings-toggle:hover {
      color: #e1e4e8;
      border-color: #30363d;
    }
    #advanced-controls {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.75rem;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
    }
    #advanced-controls.visible { display: flex; }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #8b949e;
    }
    .control-group label span { color: #e1e4e8; font-weight: 600; font-variant-numeric: tabular-nums; }
    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #21262d;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #1f6feb;
      border-radius: 50%;
      border: 2px solid #0f1117;
      cursor: pointer;
      transition: background 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { background: #388bfd; }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #1f6feb;
      border-radius: 50%;
      border: 2px solid #0f1117;
      cursor: pointer;
    }
    .reduction-badge {
      display: none;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: #f56565;
      font-weight: 600;
    }
    .reduction-badge.visible { display: flex; }
    .reduction-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f56565;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <span class="status-dot" id="statusDot"></span>
        <h1>Easy Compressor</h1>
      </div>
      <span class="header-version">v1.0</span>
    </div>

    <p class="description">
      Applies a dynamic range compressor to audio in the current tab.
    </p>

    <button id="compressButton" class="compress-button">
      Enable Compressor
    </button>

    <div class="meter-section">
      <div class="meter-labels">
        <span>Level</span>
        <span class="reduction-badge" id="reductionBadge">Gain reduction</span>
      </div>
      <div class="meter-wrap">
        <canvas id="meter-canvas" width="268" height="24"></canvas>
      </div>
    </div>

    <button id="settingsButton" class="settings-toggle">⚙ Settings</button>

    <div id="advanced-controls">
      <div class="control-group">
        <label>
          Threshold
          <span id="threshold-value">-30 dB</span>
        </label>
        <input type="range" id="threshold-slider" min="-60" max="0" value="-30" step="1">
      </div>
      <div class="control-group">
        <label>
          Ratio
          <span id="ratio-value">8:1</span>
        </label>
        <input type="range" id="ratio-slider" min="1" max="20" value="8" step="1">
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
