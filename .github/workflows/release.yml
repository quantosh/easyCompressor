name: Build Extension Releases

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set tag name
        id: set_tag_name
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tagName="${GITHUB_REF#refs/tags/}"
            echo "TAG_NAME=$tagName" >> $GITHUB_ENV
          else
            echo "ERROR: tag_name input is required when running manually."
            exit 1
          fi
        shell: bash

      - name: Build Chrome Release
        run: pwsh ./scripts/build-release.ps1 chrome

      - name: Build Edge Release
        run: pwsh ./scripts/build-release.ps1 edge

      - name: Build Firefox Release
        run: pwsh ./scripts/build-release.ps1 firefox

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: "Automated release for ${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          files: |
            Easy.Compressor-chrome.zip
            Easy.Compressor-edge.zip
            Easy.Compressor-firefox.zip
