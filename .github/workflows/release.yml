name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.2)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.version }}"
          } else {
            $json = Get-Content manifest.json -Raw | ConvertFrom-Json
            $tag = "v$($json.version)"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_ENV

      - name: Check if tag exists
        id: check
        shell: bash
        run: |
          if git rev-parse "${{ env.TAG }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "${{ env.TAG }}" -m "Release ${{ env.TAG }}"
          git push origin "${{ env.TAG }}"

      - name: Build Chrome
        if: steps.check.outputs.exists == 'false'
        run: pwsh ./scripts/build-release.ps1 chrome

      - name: Build Edge
        if: steps.check.outputs.exists == 'false'
        run: pwsh ./scripts/build-release.ps1 edge

      - name: Build Firefox
        if: steps.check.outputs.exists == 'false'
        run: pwsh ./scripts/build-release.ps1 firefox

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: "Automated release for ${{ env.TAG }}"
          draft: false
          prerelease: false
          files: Easy.Compressor-*.zip
